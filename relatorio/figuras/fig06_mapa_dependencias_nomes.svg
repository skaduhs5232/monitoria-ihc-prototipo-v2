<rect x="857.5" y="301.0" width="205" height="58" rx="8" fill="#FFE3C7" stroke="#FF7A00" stroke-width="2"/>
<text x="960" y="324" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#222">Correção e cautela</text>
