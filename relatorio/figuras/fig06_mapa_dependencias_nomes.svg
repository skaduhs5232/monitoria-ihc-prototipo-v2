<rect x="97.5" y="46.0" width="205" height="58" rx="8" fill="#0D3B4C" stroke="#0D3B4C" stroke-width="2"/>
<text x="200" y="69" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#ffffff">Problema e finalidade</text>
<text x="200" y="87" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#ffffff">(Cebola Semiótica)</text>
<rect x="457.5" y="46.0" width="205" height="58" rx="8" fill="#0D3B4C" stroke="#0D3B4C" stroke-width="2"/>
<text x="560" y="69" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#ffffff">Proto-persona</text>
<text x="560" y="87" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#ffffff">e papéis (Maria Monitor)</text>
<rect x="837.5" y="46.0" width="205" height="58" rx="8" fill="#0D3B4C" stroke="#0D3B4C" stroke-width="2"/>
<text x="940" y="69" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#ffffff">IA centrada no humano</text>
<text x="940" y="87" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#ffffff">IA recomenda, monitor decide</text>
