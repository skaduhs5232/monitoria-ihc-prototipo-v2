<text x="450" y="204" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#ffffff">Modelo de tarefas</text>
<text x="450" y="222" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#ffffff">e requisitos funcionais</text>
